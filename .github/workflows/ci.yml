name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'feat/**', 'fix/**', 'hotfix/**', 'chore/**']
  pull_request:
    # Inclui as bases de PRs empilhados (ex.: chore/** como base de feat/**).
    branches: [main, develop, 'chore/**', 'feature/**', 'feat/**']

permissions:
  contents: read

jobs:
  formatacao:
    name: Formatação (raiz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  backend:
    name: Back-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências
        run: npm audit --audit-level=high

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Histórico completo: um segredo removido em commit antigo continua exposto.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Fixada no commit da v3.0.0 para que uma tag movida não altere o que roda.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências
        run: npm audit --audit-level=high
